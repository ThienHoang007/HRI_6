gesture_recognition_node:
  ros__parameters:
    camera_index: 0
    frame_width: 640
    frame_height: 480
    fps: 30.0
    min_gesture_score: 0.65
    min_hand_detection_confidence: 0.60
    min_hand_presence_confidence: 0.60
    min_tracking_confidence: 0.60
    stable_frames: 4
    num_hands: 1
    model_path: ""
    show_window: true
    window_name: "TurtleBot 4 - Gesture Recognition"
    wave_min_x_range: 0.08
    wave_min_direction_changes: 2
    wave_hold_ms: 800

robot_behavior_node:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    gesture_topic: "/detected_gesture"
    control_rate_hz: 20.0
    stable_messages: 2
    signal_timeout_s: 1.5
    linear_speed: 0.20
    angular_speed: 0.70
    greeting_half_s: 0.80
    forward_s: 1.00
    backward_s: 1.00
    pause_s: 0.30
    forward_backward_repetitions: 4
    circle_linear_speed: 0.18
    circle_angular_speed: 0.35
